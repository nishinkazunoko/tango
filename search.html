<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>単語検索</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">

    <script src="assets/js/main.js" defer></script>
    <style>/* styles.css - アプリケーションのスタイルを定義します */
      /* 全体のレイアウト */
      :root { --orange:  #f26831; }
      body {
          margin: 0;
          padding: 0;
          background-color: #f4f4f4;
          font-family: "Noto Sans JP", sans-serif;
          font-optical-sizing: auto;
          font-weight: 400;
          font-style: normal;
          font-size: 16px;
        }
      
      /* ヘッダー */
      header {
          background: var(--orange);
          color: #ffffff;
          padding: 10px 0;
          text-align: center;
      }
      
      /* コンテナ */
      .container {
          width: 80%;
          margin: auto;
          overflow: hidden;
      }
      
      /* ステータスメッセージ */
      #status {
          font-size: 1.2em;
          margin: 20px 0;
      }
      
      /* 単語リスト */
      .word-list {
          list-style: none;
          padding: 0;
      }
      
      .word-list li {
          background: #ffffff;
          margin: 5px 0;
          padding: 10px;
          border: 1px solid #ddd;
          border-radius: 5px;
      }
      
      /* 検索ボックス */
      .search-box {
          margin: 20px 0;
      }
      
      .search-box input[type="text"] {
          padding: 10px;
          width: calc(100% - 22px);
          border: 1px solid #ddd;
          border-radius: 5px;
      }
      
      /* ボタン */
      button {
          padding: 10px 15px;
          background: var(--orange);
          color: #ffffff;
          border: 2px solid #fff;
          border-radius: 5px;
          cursor: pointer;
      }
      
      button:hover {
          background: #0e3210;
      }
      input{
        padding: 10px;
      }
      ul,li{
        padding: 0;
      }
      li{
        list-style: none;
      }
      #wordList{
        display: grid;
        grid-template-columns: 45% 45%;
        justify-content: center;
      }
      .search-box{
        display: flex;
        gap: 10px;
        padding: 0 15px;

      }
      @media (max-width:800px) {
        #wordList{
          grid-template-columns: 100%;
          padding: 0 15px;
        }
        .search-box{
          display: flex;
          flex-direction: column;
          gap:15px;
        }
      }
      </style>
</head>
<body>
    <header>
      <nav>
        <ul>
            <li>
                <a href="/index.html" style="color: #fff;">単語帳画面</a>
            </li>
        </ul>
    </nav>
        <h1>tango</h1>
        <div class="search-box">
          <input type="text" id="searchEnglish" placeholder="英単語で検索">
          <input type="text" id="searchJapanese" placeholder="日本語で検索">
        </div>
        <button id="searchButton">検索</button>

    </header>
    <main>
        <div id="wordList"></div>
    </main>
    <footer>
        <p>&copy;</p>
    </footer>
    <script>
        let allWords = [];

        window.onload = async () => {
            await loadJSON();
            document.getElementById('searchButton').addEventListener('click', filterWords);
            document.getElementById('searchEnglish').addEventListener('keydown', handleEnter);
            document.getElementById('searchJapanese').addEventListener('keydown', handleEnter);
        };

        async function loadJSON() {
            try {
                const response = await fetch('./assets/js/tango.json');
                const data = await response.json();
                allWords = data.Vocabulary;
                displayWords(allWords);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('wordList').innerText = "エラー: 単語データが読み込めません。";
            }
        }

        function handleEnter(e) {
        if (e.key === 'Enter') {
            filterWords();
            }
        }

        function displayWords(words) {
            const wordList = document.getElementById('wordList');
            wordList.innerHTML = '';
            words.forEach(word => {
                const wordItem = document.createElement('div');
                wordItem.classList.add("words");
                wordItem.innerHTML = `<p>${word.English} - ${word.Japanese}</p>`;
                wordList.appendChild(wordItem);
            });
        }

        function filterWords() {
            const englishQuery = document.getElementById('searchEnglish').value.toLowerCase();
            const japaneseQuery = document.getElementById('searchJapanese').value.toLowerCase();
            const filteredWords = allWords.filter(word => 
                word.English.toLowerCase().includes(englishQuery) &&
                word.Japanese.toLowerCase().includes(japaneseQuery)
            );
            displayWords(filteredWords);
        }
    </script>
</body>
</html>
